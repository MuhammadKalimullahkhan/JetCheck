<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jet Check </title>

    <!-- Google -->
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <!-- End Google -->

    <link rel="stylesheet" href="/static/mdb5/css/core.min.css" />
    <link rel="stylesheet" href="/static/css/style.css" />

    <script defer src="/static/mdb5/js/mdb.min.js"></script>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* to center vertically */
          }
    </style>
</head>

<body>
    <div class="position-fixed d-flex align-items-center justify-content-center"
      style="bottom: 5%;right: 0%;z-index: 2; width: 100%;">
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show text-center" role="alert" data-mdb-autohide="true"
        data-mdb-delay="3000">
        {{ message | safe}}
      </div>
      {% endfor %}
      {% endif %}
      {% endwith %}
    </div>
    
    <div class="container">
        <div class="row w-100">
            <div class="col-12">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
            </div>
            <div class="col-12">
                <form action="" method="post">
                    <div class="row">
                        <div class="col-12 col-md-12 col-lg-6 mt-3">
                            <label for="taFirstName" style="color: var(--fonts-color);">
                                First Name <span class="text-danger">*</span>
                            </label>
                            <input class="form-control" type="text" name="taFirstName" id="taFirstName"
                                placeholder="Peter" minlength="3" required>
                        </div>
                        <div class="col-12 col-md-12 col-lg-6 mt-3">
                            <label for="taLastName" style="color: var(--fonts-color);">
                                Last Name <span class="text-danger">*</span>
                            </label>
                            <input class="form-control" type="text" name="taLastName" id="taLastName"
                                placeholder="Smith" minlength="3" required>
                        </div>
                        <div class="col-12 col-md-12 col-lg-6 mt-3">
                            <label for="taPassword" style="color: var(--fonts-color);">
                                Password <span class="text-danger">*</span>
                            </label>
                            <input class="form-control" type="password" name="taPassword" placeholder="Password" minlength="8" required>
                        </div>
                        <div class="col-12 col-md-12 col-lg-6 mt-3">
                            <label for="taContact" style="color: var(--fonts-color);">
                                Contact (Optional)
                            </label>
                            <input class="form-control" type="text" name="taContact" id="taContact"
                                placeholder="+9XXXXXXXXXXXXX">
                        </div>
                    </div>
                    <button id="submit" type="submit" class="btn btn-lg btn-primary btn-block mt-4">
                        Create Profile
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
