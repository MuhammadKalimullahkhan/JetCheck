{% extends 'base.html' %}
{% block body %}
<div class="row py-3">
    <div class="col-12 d-flex">
        <h3>{{ title }}</h3>
    </div>
    <div class="hr"></div>
</div>
<div class="row">
    <div class="col-12" id="profile">
        <h5>Profile</h5>
        <form action="{{ url_for('instructor.update_account') }}" method="post">
            <div class="row">
                <div class="col-12 col-md-12 col-lg-12 mt-3">
                    <label for="insFirstName" style="color: var(--fonts-color);">
                        First Name
                    </label>
                    <input class="form-control" type="text" name="insFirstName" id="insFirstName"
                        value="{{account.first_name}}">
                </div>
                <div class="col-12 col-md-12 col-lg-12 mt-3">
                    <label for="insLastName" style="color: var(--fonts-color);">
                        Last Name
                    </label>
                    <input class="form-control" type="text" name="insLastName" id="insLastName"
                        value="{{account.last_name}}">
                </div>
                {% if account.contact %} 
                <div class="col-12 col-md-12 col-lg-12 mt-3">
                    <label for="insContact" style="color: var(--fonts-color);">
                        Contact
                    </label>
                    <input class="form-control" type="text" name="insContact" id="insContact" value="{{account.contact}}">
                </div>
                {% endif %}
                <div class="col-12 col-md-12 col-lg-12 mt-3">
                    <label for="insNewPassword" style="color: var(--fonts-color);">
                        New Password
                    </label>
                    <input class="form-control" type="password" name="insNewPassword" placeholder="Account new password">
                </div>
                <div class="col-12 col-md-12 col-lg-12 mt-3">
                    <label for="insOldPassword" style="color: var(--fonts-color);">
                        Old Password <span class="text-danger">*</span>
                    </label>
                    <input class="form-control" type="password" name="insOldPassword" placeholder="Your account password">
                </div>
                <div class="col-12 col-md-12 col-lg-12 mt-3">
                    <button class="btn btn-lg btn-primary">update</button>
                </div>
            </div>
        </form>
    </div>
    <div class="col-12 mt-5 pb-3" id="institution">
        <h5>Institution</h5>
        <div class="row">
            <div class="col-12">
                <form action="{{ url_for('instructor.update_institute') }}" method="post">
                    <div class="col-12 col-md-12 col-lg-12 mt-3">
                        <label for="insInstituteName">
                            Name of Institute 
                        </label>
                        <input class="form-control" type="text" name="insInstituteName" id="insInstituteName"
                            value="{{account.institute[0].name}}">
                    </div>
                    <div class="col-12 col-md-12 col-lg-12 mt-3">
                        <label for="insPassword" style="color: var(--fonts-color);">
                            Password <span class="text-danger">*</span>
                        </label>
                        <input class="form-control" type="password" name="insPassword" placeholder="Your account password">
                    </div>
                    <div class="col-12 col-md-12 col-lg-12 mt-3">
                        <button class="btn btn-lg btn-primary">update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
