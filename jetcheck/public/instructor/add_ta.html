{% extends 'base.html' %}
{% block body %}

<div class="row">
    {{ labels() }}
    <div class="hr mb-4"></div>
</div>

<div class="row">
    <div class="col-12">
        <div class="row">
            <form action="" method="post">
                <div class="row">
                    <div class="col-12 col-md-12 col-lg-12 mt-3">
                        <label for="taEmail" style="color: var(--fonts-color);">
                            Email <span class="text-danger">*</span>
                        </label>
                        <input class="form-control" type="text" name="taEmail" id="taEmail"
                            placeholder="bob@wss.com">
                    </div>
                    <div class="col-12 col-md-6 col-lg-6 mt-3">
                        <label for="taInitialDate" style="color: var(--fonts-color);">
                            Initial Date <span class="text-danger">*</span>
                        </label>
                        <input class="form-control" type="date" name="taInitialDate" id="taInitialDate">
                    </div>
                    <div class="col-12 col-md-6 col-lg-6 mt-3">
                        <label for="taExpireDate" style="color: var(--fonts-color);">
                            Expire Date <span class="text-danger">*</span>
                        </label>
                        <input class="form-control" type="date" name="taExpireDate" id="taExpireDate">
                    </div>
                    <div class="col-12 mt-3">
                        <label for="taAccountStatus" style="color: var(--fonts-color);">
                            Account Status
                        </label>
                        <select class="select" name="taAccountStatus" id="taAccountStatus">
                            <option value="0">Locked</option>
                            <option value="1" selected>Open</option>
                        </select>
                    </div>
                </div>
                <button id="submit" type="submit" class="btn btn-lg btn-primary btn-block mt-4">
                    add TA
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
